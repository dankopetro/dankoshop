name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./storefront

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-storefront
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy to Railway
        run: railway up --service dankoshop-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  healthcheck:
    runs-on: ubuntu-latest
    needs: [deploy-storefront, deploy-backend]
    steps:
      - name: Wait for deploys
        run: sleep 60
      
      - name: Check frontend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dankoshop.vercel.app)
          if [ "$STATUS" -ne 200 ]; then echo "Frontend health check failed: $STATUS"; exit 1; fi
          echo "Frontend healthy: $STATUS"
      
      - name: Check backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dankoshop-backend.railway.app/health)
          if [ "$STATUS" -ne 200 ]; then echo "Backend health check failed: $STATUS"; exit 1; fi
          echo "Backend healthy: $STATUS"